
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Expense Tracker</h1>
    <p class="subtitle">Keep track of your daily expenses</p>

    <div class="form">
      <input type="text" id="name" placeholder="Expense name">

      <input type="number" id="amount" placeholder="Amount">

      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Other</option>
      </select>

      <button id="addBtn">Add Expense</button>
    </div>

    <div class="search">
      <input type="text" id="search" placeholder="Search expenses...">
    </div>

    <div class="total-box">
      <p>Total Expenses</p>
      <h2>NPR<span id="total">0</span></h2>
    </div>

    <h3>Expense List</h3>

    <ul id="expenseList"></ul>

  </div>

  <script src="script.js"></script>

</body>
</html>
